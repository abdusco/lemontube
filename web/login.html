<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>Sign in · LemonTube</title>
  <link rel="stylesheet" href="/styles.css?v=6">
</head>
<body>
  <main class="login-page">
    <a class="brand" href="/" aria-label="LemonTube home"><span class="brand-mark" aria-hidden="true">✳</span><span>Lemon<span class="brand-accent">Tube</span></span></a>
    <form class="card login-card" action="/login" method="post">
      <h1>Sign in</h1>
      <p>Enter your LemonTube credentials.</p>
      <p class="error" id="login-error" role="alert" hidden>Incorrect username or password.</p>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" required autofocus></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary-button" type="submit">Sign in</button>
    </form>
  </main>
  <script>if (new URLSearchParams(location.search).has('error')) document.getElementById('login-error').hidden = false;</script>
</body>
</html>
